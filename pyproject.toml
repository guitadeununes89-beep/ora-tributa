[project]
name = "tributaria-workspace"
version = "0.1.0"
description = "Workspace da Plataforma de Inteligencia Tributaria"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.uv.workspace]
members = ["backend", "tax-engine", "importers"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests", "backend/tests", "tax-engine/tests", "importers/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

