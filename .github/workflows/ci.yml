name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tributaria_test
          POSTGRES_USER: tributaria
          POSTGRES_PASSWORD: tributaria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tributaria -d tributaria_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tributaria:tributaria@localhost:5432/tributaria_test
      POSTGRES_TESTS: "1"
      DEV_SEED_PASSWORD: ci-only-throwaway-password-1
      REAL_RULE_APPROVER_EMAIL: ci-approver@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev
      - run: uv run alembic upgrade head
      # Deploys the 5 real, already-approved rules into CI's ephemeral database so
      # backend-level tests (e.g. test_evaluate_many.py) exercise the real governed
      # rules instead of skipping - mirrors docs/DEVELOPMENT_ACCESS.md's local sequence.
      - run: uv run python database/seeds/development_governance.py
      - run: uv run python database/seeds/development_identity.py
      - run: uv run python database/seeds/development_synthetic.py
      - run: uv run python -m tributaria_api.governed_load_cli
      - run: uv run python -m tributaria_api.territory_governed_load_cli
      - run: uv run python -m tributaria_api.real_rule_deploy_cli
      - run: uv run python -m tributaria_api.real_rule_deploy_cli_p2_medicamentos
      - run: uv run python -m tributaria_api.real_rule_deploy_cli_p1_zfm
      - run: uv run ruff check .
      - run: uv run mypy backend/src tax-engine/src importers/src
      - run: uv run pytest --cov=tax_engine --cov=tributaria_api --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

